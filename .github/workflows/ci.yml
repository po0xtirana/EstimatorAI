name: Application checks

on:
  push:
    branches: [master, agent/estimator-ai-build]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:migrations
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
