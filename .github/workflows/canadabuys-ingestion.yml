name: Connected tender source ingestion

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check ingestion configuration
        id: config
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CANADABUYS_TENDER_CSV_URL: ${{ secrets.CANADABUYS_TENDER_CSV_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tender-source ingestion skipped because DATABASE_URL is required. Connected sources remain visible as not scanned."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run ingest:tender-sources
        if: steps.config.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CANADABUYS_TENDER_CSV_URL: ${{ secrets.CANADABUYS_TENDER_CSV_URL }}
